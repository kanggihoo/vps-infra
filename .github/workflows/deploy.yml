name: Deploy VPS Infra (manual rollback)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            bash -lc '
              set -euo pipefail
              cd /opt/vps-infra

              BEFORE="${{ github.event.before }}"
              SHA="${{ github.sha }}"
              target="all"

              git fetch origin main
              if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                changed="$(git diff --name-only "$BEFORE" "$SHA" || true)"
                # Use targeted deploy only when every changed file is under portal/.
                if [ -n "$changed" ] && ! printf "%s\n" "$changed" | grep -qv "^portal/"; then
                  target="portal"
                fi
              fi

              git pull --ff-only origin main
              chmod +x scripts/deploy.sh scripts/healthcheck.sh
              ./scripts/deploy.sh "$target"
            '
