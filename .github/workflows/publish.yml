name: Publish Portal
on:
  workflow_call:
    outputs:
      digest:
        value: ${{ jobs.portal.outputs.digest }}

jobs:
  portal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/kanggihoo/vps-infra-portal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing SHA tag
        run: |
          if result=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" 2>&1); then
            echo "::error::SHA tag already published. Use the recorded digest for redeploy."
            exit 1
          fi
          if [[ "$result" != *"not found"* && "$result" != *"manifest unknown"* ]]; then
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - name: Build and publish
        uses: docker/build-push-action@v7
        id: build
        with:
          context: ./portal
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: PORTAL_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Commit: `%s`\n\nImage: `%s@%s`\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
