name: CI
on: workflow_call
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # compose는 변수가 없으면 config 단계에서 경고/실패하므로 예시 값을 넣는다.
      # 검증 대상은 문법이지 값이 아니다.
      - name: Validate compose syntax
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose -f observability/compose.yml --env-file .env config >/dev/null

      # 로컬 모드와 VPS 모드로 렌더해 `nginx -t`로 문법을 본다. 로컬에서도 같은 스크립트를 쓴다.
      - name: Validate nginx templates
        run: ./scripts/test-nginx-templates.sh

      # 빠른 루프(수초). 로직 버그를 push 시점에 잡는다.
      # seam 2는 스택 기동이 필요해 CI에 두지 않는다(로컬에서 실행).
      - name: Run seam 1 (deploy target selection)
        run: ./scripts/test-select-target.sh

      # deploy.sh의 .env 가드(live 계정·화이트리스트, 따옴표 없는 $)를 스택 없이 확인한다.
      - name: Verify deploy guards
        run: ./scripts/test-deploy-guards.sh

      - name: Run seam 3 (SOPS roundtrip)
        run: |
          docker compose --env-file .env.example \
            run --rm --no-deps tools ./scripts/test-sops.sh

      - name: Verify SOPS files are encrypted
        run: ./scripts/check-sops.sh

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan introduced commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/scan-secrets.sh ci "$BASE" "$GITHUB_SHA"

  portal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Portal without publishing
        run: docker build --build-arg "PORTAL_REVISION=$GITHUB_SHA" ./portal

  gate:
    if: always()
    needs: [validate, gitleaks, portal-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all CI jobs to pass
        env:
          VALIDATE: ${{ needs.validate.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          PORTAL_BUILD: ${{ needs.portal-build.result }}
        run: |
          printf 'validate=%s gitleaks=%s portal-build=%s\n' "$VALIDATE" "$GITLEAKS" "$PORTAL_BUILD"
          [[ "$VALIDATE" == success && "$GITLEAKS" == success && "$PORTAL_BUILD" == success ]]
