name: Validate infra config

# PR과 main에서 설정 문법·로직을 검증하고, main은 통과하면 VPS에 배포한다(ADR 0020).
# 배포는 SSH로 VPS의 scripts/ci-deploy.sh에 "<sha> [target]"만 보낸다. 배포 내용은 그 스크립트에 있다.
on:
  push:
    branches: [main]
  pull_request:
  # 수동 재배포·롤백. main을 골라 실행한다. auto는 마지막 성공 배포부터의 변경으로 대상을 고른다.
  workflow_dispatch:
    inputs:
      target:
        description: 배포 대상
        type: choice
        options: [auto, all, portal, observability]
        default: auto

permissions:
  contents: read

# PR은 새 push가 오면 이전 실행을 취소한다. main은 취소하지 않고 순서대로 돈다(배포 도중에 끊지 않는다).
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 배포 대상. host key를 고정해 다른 서버에 접속하지 않는다(키가 바뀌면 배포가 실패한다).
  VPS_HOST: 187.77.114.68
  VPS_USER: kkh
  VPS_HOST_KEY: 187.77.114.68 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAkuL3u1JaTmO9cAZIcgiYyLJLIdDENedbywa+/YOsfo

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # compose는 변수가 없으면 config 단계에서 경고/실패하므로 예시 값을 넣는다.
      # 검증 대상은 문법이지 값이 아니다.
      - name: Validate compose syntax
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose -f jenkins/compose.yml config >/dev/null
          docker compose -f observability/compose.yml --env-file .env config >/dev/null
        env:
          # jenkins/compose.yml의 필수 변수. 값은 검증용 더미다.
          # 필수(:?)로 둔 이유는 조용한 기본값이 경로 불일치를 숨기기 때문이다.
          DOCKER_GID: "999"
          APP_DIR: /home/jenkins/app/vps-infra
          APP_DIR_HOST: /home/jenkins/app/vps-infra
          INFRA_SCM_URL: /home/jenkins/app/vps-infra
          JENKINS_ADMIN_ID: ci
          JENKINS_ADMIN_PASSWORD: ci
          CASC_RELOAD_TOKEN: ci

      # nginx 템플릿은 envsubst 치환 전에는 유효한 conf가 아니다.
      # 이미지 entrypoint와 같은 방식으로 렌더한 뒤 `nginx -t`로 문법을 본다.
      #
      # `nginx -t`는 upstream 이름을 DNS로 해석하므로, 대상 컨테이너가 없는
      # CI에서는 "host not found in upstream"으로 실패한다. 문법만 보려면
      # 이름이 해석되어야 하므로 더미 컨테이너를 같은 네트워크에 띄운다.
      # (jenkins는 변수+resolver를 쓰므로 기동 시 해석되지 않아도 된다)
      #
      # 로컬과 VPS 두 모드를 모두 검증한다. 한쪽만 보면 다른 쪽 오타를 놓친다.
      - name: Validate nginx templates
        run: |
          set -eu
          docker network create ci_validate
          for svc in whoami portal; do
            docker run -d --rm --name "$svc" --network ci_validate \
              traefik/whoami:v1.10 >/dev/null
          done
          trap 'docker rm -f whoami portal >/dev/null 2>&1 || true; \
                docker network rm ci_validate >/dev/null 2>&1 || true' EXIT

          # VPS 모드는 인증서 파일이 있어야 `nginx -t`를 통과한다.
          # 더미 인증서를 만들어두면 인증서 경로 오타까지 이 단계에서 드러난다.
          # 로컬 모드는 이 마운트를 무시하므로 두 모드가 같은 호출을 쓴다.
          mkdir -p /tmp/le/live/kkh-hub.tech
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=kkh-hub.tech' \
            -keyout /tmp/le/live/kkh-hub.tech/privkey.pem \
            -out /tmp/le/live/kkh-hub.tech/fullchain.pem >/dev/null 2>&1

          validate() {
            echo "--- BASE_DOMAIN=$1 NGINX_LISTEN=$2 TLS_MODE=$3 ---"
            docker run --rm --network ci_validate \
              -e BASE_DOMAIN="$1" \
              -e NGINX_LISTEN="$2" \
              -e TLS_MODE="$3" \
              -e CHALLENGE_DOMAINS="$4" \
              -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/nginx/templates:/etc/nginx/templates:ro" \
              -v "$PWD/nginx/tls:/etc/nginx/tls:ro" \
              -v "$PWD/nginx/test-fixtures/basic-auth.htpasswd:/etc/nginx/basic-auth.htpasswd:ro" \
              -v /tmp/le:/etc/letsencrypt:ro \
              nginx:1.31.4-alpine-otel \
              sh -c '/docker-entrypoint.sh nginx -t'
          }

          # 두 모드를 모두 검증한다. 한쪽만 보면 다른 쪽 오타를 놓친다.
          validate localhost 80 none acme-challenge.invalid
          validate kkh-hub.tech "443 ssl" live \
            "kkh-hub.tech health.kkh-hub.tech portal.kkh-hub.tech jenkins.kkh-hub.tech notes.kkh-hub.tech"

      # 빠른 루프(수초). 로직 버그를 push 시점에 잡는다.
      # seam 2는 스택 기동이 필요해 CI에 두지 않는다(로컬에서 실행).
      - name: Run seam 1 (deploy target selection)
        run: ./scripts/test-select-target.sh

      - name: Run seam 3 (SOPS roundtrip)
        run: |
          docker compose --env-file .env.example \
            run --rm --no-deps tools ./scripts/test-sops.sh

      - name: Verify SOPS files are encrypted
        run: ./scripts/check-sops.sh

  # 이 key는 VPS authorized_keys의 forced command로 묶여 있어 "<sha> [target]" 말고는 아무것도 실행할 수 없다.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          TARGET: ${{ inputs.target || 'auto' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$GITHUB_SHA $TARGET"

  # 배포 결과를 Mattermost로 알린다(ADR 0012). secret이 없으면 건너뛴다. 취소된 실행은 알리지 않는다.
  notify:
    needs: [validate, deploy]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 커밋 메시지 같은 사용자 입력은 env로만 넘긴다. run에 ${{ }}로 넣으면 셸 코드로 해석될 수 있다.
      - name: Send to Mattermost
        env:
          HOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          VALIDATE: ${{ needs.validate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          TARGET: ${{ inputs.target || 'auto' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "[notify] MATTERMOST_WEBHOOK_URL이 없어 알림을 건너뛴다"
            exit 0
          fi
          ok=$([ "$DEPLOY" = success ] && echo 1 || echo 0)
          stage=$([ "$VALIDATE" = success ] && echo deploy || echo validate)
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          title="배포 $([ "$ok" = 1 ] && echo 성공 || echo 실패) · vps-infra main"
          text="${subject:-수동 재배포}$([ "$ok" = 1 ] || echo " · 실패 단계: ${stage}. 로그: ${RUN_URL}")"
          color=$([ "$ok" = 1 ] && echo '#2eb886' || echo '#d33f3f')
          jq -n --arg title "$title" --arg link "$RUN_URL" --arg color "$color" --arg text "$text" \
            --arg commit "[\`${GITHUB_SHA::7}\`](${COMMIT_URL})" --arg actor "$ACTOR" --arg target "$TARGET" \
            '{username: "GitHub Actions", attachments: [{color: $color, title: $title, title_link: $link, text: $text,
              fields: [{short: true, title: "커밋", value: $commit}, {short: true, title: "실행자", value: $actor},
                       {short: true, title: "요청 대상", value: $target}]}]}' |
            curl -fsS --max-time 10 -H 'Content-Type: application/json' -d @- "$HOOK" >/dev/null ||
            echo "[notify] 알림 전송 실패(결과에는 영향 없음)"
