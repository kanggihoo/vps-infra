name: Infra PR
on:
  pull_request:

permissions:
  contents: read

# 같은 PR에 commit이 연달아 들어오면 이전 검사를 취소한다.
concurrency:
  group: infra-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # job id `ci`가 PR check 이름 `ci / gate`를 만든다. Ruleset이 이 이름을 필수 check로 쓴다.
  ci:
    uses: ./.github/workflows/ci.yml
