# SOPS 암호화 규칙. `sops --encrypt` 시 이 파일의 age 수신자가 자동 적용된다.
#
# ┌─ 사용자 작업 필요 ─────────────────────────────────────────────┐
# │ 아래 age 공개키는 placeholder다. 실제 키로 교체해야 동작한다.  │
# │                                                                │
# │ 1) 로컬에서 key 생성 (한 번만):                                │
# │      mkdir -p ~/.config/sops/age                               │
# │      age-keygen -o ~/.config/sops/age/keys.txt                 │
# │    출력된 "Public key: age1..." 값을 아래 age: 에 넣는다.       │
# │                                                                │
# │ 2) VPS에도 같은 key 파일을 배치:                               │
# │      ~/.config/sops/age/keys.txt                               │
# │                                                                │
# │ 3) key 백업. 분실하면 secret을 복호화할 수 없다(ADR 0010).      │
# └────────────────────────────────────────────────────────────────┘
# creation_rules는 **암호화할 때만** 적용된다. path_regex는 입력 파일 경로에
# 매칭된다(출력이 아니다).
#
# 복호화할 때 SOPS는 이 규칙을 보지 않고 **파일 확장자**로 형식을 판단한다.
# 그래서 암호화 결과 파일명이 `secrets/env.sops.env`처럼 SOPS가 아는 확장자로
# 끝나야 한다. `.sops`로 끝내면 JSON으로 추측해 복호화가 실패한다.
creation_rules:
  # .env 형태. dotenv로 다루면 값만 암호화되어 어떤 키가 바뀌었는지 diff에 남는다.
  # 규칙 순서가 중요하다 — 첫 매칭이 이기므로 포괄 규칙보다 위에 둔다.
  - path_regex: (^|/)\.env$|(^|/)secrets/env\.sops\.env$
    input_type: dotenv
    output_type: dotenv
    age: age1mh8hd0zyjkx53jldewvwf4en9yn0mt96uqhaz3zj8yupemvupp4qv0amj8

  # htpasswd와 PAT는 구조가 없는 텍스트이므로 파일 전체를 암호화한다.
  - path_regex: secrets/.*
    input_type: binary
    output_type: binary
    age: age1mh8hd0zyjkx53jldewvwf4en9yn0mt96uqhaz3zj8yupemvupp4qv0amj8
