# TLS_MODE=live (VPS). certbot이 발급한 인증서를 사용한다.
#
# 경로에 kkh-hub.tech 하나만 있는 이유:
#   도메인 여러 개를 한 장(SAN 인증서)에 담아 발급했다.
#   certbot은 -d 로 준 첫 도메인 이름으로 폴더를 만든다.
#
# 이 폴더는 certbot-etc 볼륨이며 nginx는 읽기 전용(:ro)으로만 마운트한다.
ssl_certificate     /etc/letsencrypt/live/kkh-hub.tech/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/kkh-hub.tech/privkey.pem;
