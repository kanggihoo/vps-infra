# ============================================================
# jenkins.kkh-hub.tech -> jenkins 컨테이너
#
# 기본 구조는 portal.conf와 동일. 상세 주석은 그쪽 참고.
# 아래쪽에 WebSocket 관련 설정 4줄이 추가로 붙는다.
#
# 주의: jenkins 컨테이너는 이 compose 프로젝트가 아니라
#       jenkins/compose.yml 이 띄운다. 같은 vps_proxy 네트워크에
#       붙어 있어서 이름으로 찾을 수 있는 것.
# ============================================================

server {
    listen 443 ssl;
    server_name jenkins.kkh-hub.tech;

    ssl_certificate     /etc/letsencrypt/live/kkh-hub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkh-hub.tech/privkey.pem;

    location / {
        proxy_pass http://jenkins:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- 아래는 Jenkins 전용. WebSocket 때문에 필요하다. ---
        # Jenkins 웹 UI는 빌드 로그를 실시간으로 흘려보낼 때 WebSocket을 쓴다.
        # 이 4줄이 없으면 로그가 멈춰 있다가 새로고침해야 나온다.

        # WebSocket 업그레이드는 HTTP/1.1 이상에서만 가능.
        # nginx는 뒤쪽으로 보낼 때 기본이 1.0이라 명시해야 한다.
        proxy_http_version 1.1;

        # 클라이언트가 보낸 Upgrade 헤더(값: websocket)를 그대로 전달.
        proxy_set_header Upgrade $http_upgrade;

        # 프로토콜 전환 요청임을 뒤쪽에 알린다.
        proxy_set_header Connection "upgrade";

        # 뒤쪽 응답을 기다리는 최대 시간(초). 기본값 60초.
        # WebSocket 연결은 데이터 없이 오래 열려 있을 수 있어 넉넉히 준다.
        proxy_read_timeout 90s;
    }
}
