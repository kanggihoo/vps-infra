# ============================================================
# health.kkh-hub.tech -> whoami 컨테이너
#
# 구조는 portal.conf와 동일. 상세 주석은 그쪽 참고.
# 차이점: 목적지가 whoami:80 이라는 것뿐.
#
# whoami = 받은 요청 정보를 그대로 텍스트로 돌려주는 진단용 컨테이너.
#          DNS/TLS/라우팅이 정상인지 확인하는 용도.
# ============================================================

server {
    listen 443 ssl;
    server_name health.kkh-hub.tech;

    ssl_certificate     /etc/letsencrypt/live/kkh-hub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkh-hub.tech/privkey.pem;

    location / {
        # whoami 이미지는 80번 포트에서 듣는다 (portal의 8080과 다름).
        proxy_pass http://whoami:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
