# ============================================================
# notes.kkh-hub.tech -> Quartz 정적 사이트
#
# 다른 conf와 다른 점: proxy_pass가 없다.
# Quartz 빌드 결과물은 HTML 파일 더미라서 서버 프로세스가 필요 없고,
# nginx가 파일을 직접 읽어 응답한다.
#
# 파일 출처: Jenkins가 quartz-site-private를 빌드해서
#            호스트 /opt/quartz-site/ 에 배치 -> 여기로 마운트됨.
# ============================================================

server {
    listen 443 ssl;
    server_name notes.kkh-hub.tech;

    ssl_certificate     /etc/letsencrypt/live/kkh-hub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkh-hub.tech/privkey.pem;

    # 정적 파일을 찾을 기준 폴더.
    root /var/www/notes;

    # 개인 노트이므로 Basic Auth로 보호한다.
    # 사용자 파일은 VPS의 /opt/nginx-auth/notes.htpasswd 에 있다.
    auth_basic           "Notes";
    auth_basic_user_file /etc/nginx/notes.htpasswd;

    location / {
        # Quartz는 /some/note 처럼 확장자 없는 URL을 만든다.
        # 순서대로 시도해서 처음 존재하는 것을 응답한다.
        #   $uri             그대로 (이미지, css 등)
        #   $uri.html        .html 붙여서 (대부분의 노트)
        #   $uri/index.html  폴더면 그 안의 index
        #   마지막은 404
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 해시가 붙은 정적 자원은 내용이 바뀌면 파일명도 바뀌므로 길게 캐시한다.
    location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";

        # 이 블록은 위 server 단위 auth_basic을 상속하지만,
        # location 블록에서 다시 선언해야 확실히 적용된다.
        auth_basic           "Notes";
        auth_basic_user_file /etc/nginx/notes.htpasswd;

        try_files $uri =404;
    }

    # Quartz가 만든 404 페이지를 사용한다.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        auth_basic off;
    }
}
