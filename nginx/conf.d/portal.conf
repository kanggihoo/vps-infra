# ============================================================
# portal.kkh-hub.tech -> portal 컨테이너
#
# 서비스 하나당 파일 하나. 새 서비스를 붙일 때는
# 이 파일을 복사해서 server_name과 proxy_pass만 바꾸면 된다.
# ============================================================

server {
    # 443번 포트에서 받고, 이 연결은 TLS로 암호화되어 있다고 선언.
    # ssl 키워드가 있어야 아래 ssl_certificate 설정이 의미를 가진다.
    listen 443 ssl;

    # 이 블록이 담당할 도메인.
    # 브라우저가 TLS 핸드셰이크 때 SNI로 도메인을 먼저 알려주기 때문에
    # nginx는 인증서를 고르기 전에 어느 server 블록인지 판단할 수 있다.
    server_name portal.kkh-hub.tech;

    # TLS 인증서 파일 경로. certbot이 발급해서 여기에 넣어둔다.
    #   fullchain.pem - 서버 인증서 + 중간 인증서 묶음 (브라우저에 보낼 것)
    #   privkey.pem   - 개인키 (절대 외부 노출 금지)
    #
    # 경로에 kkh-hub.tech 하나만 있는 이유:
    #   도메인 4개를 한 장(SAN 인증서)에 담아 발급했다.
    #   certbot은 -d 로 준 첫 도메인 이름으로 폴더를 만든다.
    #   그래서 health/portal/jenkins conf 전부 이 경로를 똑같이 참조한다.
    #
    # 이 폴더는 certbot-etc 볼륨이며 nginx는 읽기 전용(:ro)으로만 마운트한다.
    ssl_certificate     /etc/letsencrypt/live/kkh-hub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkh-hub.tech/privkey.pem;

    # 이 도메인으로 들어온 모든 경로를 처리.
    location / {
        # 요청을 뒤쪽 컨테이너로 그대로 전달한다.
        # portal = Docker 컨테이너(서비스) 이름. IP를 쓸 필요 없다.
        #   같은 vps_proxy 네트워크에 있으면 Docker 내부 DNS가 이름을 풀어준다.
        # 8080 = portal 컨테이너 안에서 Go 서버가 듣고 있는 포트.
        #        호스트에 publish되지 않았으므로 외부에서는 접근 불가.
        # http = nginx와 컨테이너 사이 내부 구간은 암호화하지 않는다.
        #        Docker 내부 네트워크라 외부에 노출되지 않기 때문.
        proxy_pass http://portal:8080;

        # --- 아래 4줄이 필요한 이유 ---
        # nginx가 대신 요청을 보내면, 뒤쪽 앱 입장에서는
        # 모든 요청이 nginx에서 온 것으로 보인다.
        # 원래 사용자 정보가 사라지므로 헤더에 담아 따로 넘겨준다.

        # 원래 사용자가 접속한 도메인. 이게 없으면 앱이 "portal"로 인식한다.
        # 앱이 절대 URL(리다이렉트 주소 등)을 만들 때 필요.
        proxy_set_header Host $host;

        # 실제 클라이언트 IP. 없으면 앱은 nginx 컨테이너 IP만 보게 된다.
        proxy_set_header X-Real-IP $remote_addr;

        # 프록시를 여러 번 거쳤을 때의 IP 목록(쉼표 구분).
        # $proxy_add_x_forwarded_for = 기존 값 + 현재 클라이언트 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 사용자가 http로 왔는지 https로 왔는지.
        # 내부 구간은 http라서 앱이 이걸 봐야 원래 https였음을 안다.
        # 이게 없으면 앱이 http 주소로 리다이렉트를 만들어 무한 루프가 생길 수 있다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
