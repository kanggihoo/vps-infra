# ============================================================
# 80번 포트(평문 HTTP) 담당
#
# 파일명이 00- 으로 시작하는 이유:
#   nginx는 include된 파일을 알파벳 순으로 읽는다.
#   80번 처리를 가장 먼저 정의해두려는 것뿐. 기능상 강제는 아니다.
#
# 하는 일 두 가지:
#   1. 인증서 발급용 경로만 파일로 응답
#   2. 나머지 전부 HTTPS로 돌려보냄
# ============================================================

server {
    # 80번 포트에서 요청을 받는다. ssl 안 붙었으니 평문 HTTP.
    listen 80;

    # 이 server 블록이 담당할 도메인 목록.
    # 요청의 Host 헤더와 여기를 대조해서 어느 server 블록을 쓸지 고른다.
    # 새 서브도메인을 추가하면 여기에도 넣어야 인증서 발급이 된다.
    server_name kkh-hub.tech health.kkh-hub.tech portal.kkh-hub.tech jenkins.kkh-hub.tech notes.kkh-hub.tech;

    # Let's Encrypt 도메인 소유 확인(HTTP-01 challenge) 전용 경로.
    # certbot이 이 폴더에 무작위 값이 담긴 파일을 써두면
    # Let's Encrypt 서버가 http://도메인/.well-known/acme-challenge/xxx 로 읽으러 온다.
    location /.well-known/acme-challenge/ {
        # root = 요청 경로를 이 폴더 뒤에 그대로 이어붙여 파일을 찾는다.
        # 요청  /.well-known/acme-challenge/AbC123
        # 실제  /var/www/certbot/.well-known/acme-challenge/AbC123
        #
        # 이 폴더는 certbot-www 볼륨. certbot 컨테이너와 공유한다.
        root /var/www/certbot;
    }

    # 위 challenge 경로에 해당하지 않는 모든 요청.
    # location 매칭은 더 구체적인 경로가 우선이라 / 는 맨 마지막에 걸린다.
    location / {
        # 301 = 영구 이동. 브라우저가 HTTPS 주소로 다시 요청한다.
        #   $host           - 요청에 담겨온 도메인 (그대로 유지)
        #   $request_uri    - 경로 + 쿼리스트링 전체 (/skills?tab=raw 등)
        # 둘을 쓰는 이유: 사용자가 보던 페이지 그대로 HTTPS로 보내기 위해.
        return 301 https://$host$request_uri;
    }
}
