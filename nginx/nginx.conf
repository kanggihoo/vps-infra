# ============================================================
# nginx 최상위 설정 파일
# 컨테이너 안 /etc/nginx/nginx.conf 로 마운트된다.
# 라우팅은 여기 없음. conf.d/ 안에 있음.
# ============================================================

# nginx 워커 프로세스가 실행될 리눅스 사용자.
# 요청 처리는 root가 아닌 낮은 권한 사용자로 하는 게 안전하다.
# nginx:alpine 이미지에 이미 nginx 사용자가 만들어져 있다.
user  nginx;

# 요청을 실제로 처리하는 워커 프로세스 개수.
# auto = CPU 코어 수만큼 자동 생성.
worker_processes  auto;

# 연결 처리 관련 설정 블록. 필수 블록이라 비워둘 수 없다.
events {
    # 워커 프로세스 1개가 동시에 감당할 연결 수.
    # 총 동시 연결 = worker_processes * worker_connections
    worker_connections  1024;
}

# HTTP 관련 설정 전체를 감싸는 블록.
# server 블록(가상 호스트)은 반드시 이 안에 있어야 한다.
http {
    # 확장자 -> MIME 타입 매핑표를 불러온다.
    # 이게 없으면 .css 파일도 text/plain으로 응답해서 브라우저가 CSS로 인식 못 한다.
    # mime.types 파일은 nginx 이미지에 기본 포함되어 있다.
    include       mime.types;

    # mime.types에 없는 확장자일 때 쓸 기본값.
    # application/octet-stream = "그냥 바이너리 덩어리" (브라우저가 다운로드 처리)
    default_type  application/octet-stream;

    # 액세스 로그 한 줄의 형식을 'main'이라는 이름으로 정의.
    # $로 시작하는 건 nginx 내장 변수.
    #   $remote_addr    - 클라이언트 IP
    #   $remote_user    - Basic Auth 사용자명 (없으면 -)
    #   $time_local     - 요청 시각
    #   $request        - "GET /path HTTP/1.1" 요청 첫 줄 전체
    #   $status         - 응답 상태 코드 (200, 404 ...)
    #   $body_bytes_sent- 응답 본문 바이트 수
    #   $http_referer   - 이전 페이지 URL
    #   $http_user_agent- 브라우저 정보
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';

    # 위에서 정의한 main 형식으로 이 경로에 로그를 쌓는다.
    # nginx 이미지는 이 경로를 stdout으로 심볼릭 링크해 둬서
    # docker compose logs nginx 로 바로 볼 수 있다.
    access_log  /var/log/nginx/access.log  main;

    # 정적 파일 전송 시 커널이 직접 처리(sendfile 시스템콜).
    # 파일을 유저 공간으로 복사하지 않아 빠르다.
    sendfile        on;

    # 응답 후 연결을 끊지 않고 유지할 시간(초).
    # 같은 클라이언트가 이어서 요청하면 TCP 핸드셰이크를 다시 안 해도 된다.
    keepalive_timeout  65;

    # 응답 본문을 gzip으로 압축해서 보낸다. 전송량 감소.
    gzip  on;

    # conf.d/ 폴더의 모든 .conf 파일을 여기에 그대로 끼워 넣는다.
    # 알파벳 순으로 읽히므로 00- 으로 시작하는 파일이 가장 먼저.
    # 실제 라우팅(server 블록)은 전부 그쪽에 있다.
    include /etc/nginx/conf.d/*.conf;
}
