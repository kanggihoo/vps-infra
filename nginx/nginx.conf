# ============================================================
# nginx 최상위 설정 파일
# 컨테이너 안 /etc/nginx/nginx.conf 로 마운트된다.
# 라우팅은 여기 없음. conf.d/ 안에 있음.
# ============================================================

# nginx 워커 프로세스가 실행될 리눅스 사용자.
# 요청 처리는 root가 아닌 낮은 권한 사용자로 하는 게 안전하다.
# nginx:alpine 이미지에 이미 nginx 사용자가 만들어져 있다.
user  nginx;

# OpenTelemetry 모듈. nginx:*-otel 이미지에만 들어 있다(ADR 0017).
# 외부 요청의 trace를 nginx가 시작하고 traceparent로 백엔드에 전파한다.
load_module modules/ngx_otel_module.so;

# 요청을 실제로 처리하는 워커 프로세스 개수.
# auto = CPU 코어 수만큼 자동 생성.
worker_processes  auto;

# 연결 처리 관련 설정 블록. 필수 블록이라 비워둘 수 없다.
events {
    # 워커 프로세스 1개가 동시에 감당할 연결 수.
    # 총 동시 연결 = worker_processes * worker_connections
    worker_connections  1024;
}

# HTTP 관련 설정 전체를 감싸는 블록.
# server 블록(가상 호스트)은 반드시 이 안에 있어야 한다.
http {
    # 확장자 -> MIME 타입 매핑표를 불러온다.
    # 이게 없으면 .css 파일도 text/plain으로 응답해서 브라우저가 CSS로 인식 못 한다.
    # mime.types 파일은 nginx 이미지에 기본 포함되어 있다.
    include       mime.types;

    # mime.types에 없는 확장자일 때 쓸 기본값.
    # application/octet-stream = "그냥 바이너리 덩어리" (브라우저가 다운로드 처리)
    default_type  application/octet-stream;

    # 액세스 로그는 Grafana NGINX 연동의 json_analytics 포맷을 그대로 따른다(ADR 0016).
    # 커뮤니티 대시보드(grafana.com 12559, jsonnet-libs nginx-mixin)가 이 필드 이름을 전제하므로
    # 포맷을 우리 식으로 바꾸지 않고 대시보드를 그대로 쓴다. 숫자 값도 원본처럼 문자열이며
    # LogQL `| json` 뒤에서는 status >= 500 같은 비교가 그대로 된다.
    # 원본 뒤에 우리 필드 3개만 덧붙인다.
    #   level     Loki가 레벨로 인식한다. HTTP 상태로 정한다(아래 map).
    #   trace_id  Grafana가 이 값으로 Tempo 트레이스에 링크한다(ADR 0017).
    #   span_id
    map $status $log_level {
        ~^5     error;
        ~^4     warn;
        default info;
    }

    log_format json_analytics escape=json '{'
        '"msec": "$msec", '
        '"connection": "$connection", '
        '"connection_requests": "$connection_requests", '
        '"pid": "$pid", '
        '"request_id": "$request_id", '
        '"request_length": "$request_length", '
        '"remote_addr": "$remote_addr", '
        '"remote_user": "$remote_user", '
        '"remote_port": "$remote_port", '
        '"time_local": "$time_local", '
        '"time_iso8601": "$time_iso8601", '
        '"request": "$request", '
        '"request_uri": "$request_uri", '
        '"args": "$args", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"bytes_sent": "$bytes_sent", '
        '"http_referer": "$http_referer", '
        '"http_user_agent": "$http_user_agent", '
        '"http_x_forwarded_for": "$http_x_forwarded_for", '
        '"http_host": "$http_host", '
        '"server_name": "$server_name", '
        '"request_time": "$request_time", '
        '"upstream": "$upstream_addr", '
        '"upstream_connect_time": "$upstream_connect_time", '
        '"upstream_header_time": "$upstream_header_time", '
        '"upstream_response_time": "$upstream_response_time", '
        '"upstream_response_length": "$upstream_response_length", '
        '"upstream_cache_status": "$upstream_cache_status", '
        '"ssl_protocol": "$ssl_protocol", '
        '"ssl_cipher": "$ssl_cipher", '
        '"scheme": "$scheme", '
        '"request_method": "$request_method", '
        '"server_protocol": "$server_protocol", '
        '"pipe": "$pipe", '
        '"gzip_ratio": "$gzip_ratio", '
        '"level": "$log_level", '
        '"trace_id": "$otel_trace_id", '
        '"span_id": "$otel_span_id"'
    '}';

    # nginx 이미지는 이 경로를 stdout으로 심볼릭 링크해 둬서
    # docker compose logs nginx 로 바로 볼 수 있다.
    access_log  /var/log/nginx/access.log  json_analytics;

    # --- OpenTelemetry (ADR 0017) ---
    # span을 Alloy로 보낸다(OTLP/gRPC만 지원). Alloy는 별도 compose 프로젝트라
    # 없을 수 있다. 그래도 nginx는 정상 기동하고 export 실패만 error 로그로 남긴다.
    otel_exporter {
        endpoint alloy:4317;
    }
    otel_service_name nginx;

    # 외부 감시(UptimeRobot)와 Alloy blackbox probe는 5분·30초마다 오므로
    # trace하지 않는다. 그 요청도 로그의 trace_id는 채워지지만 Tempo에는 없다.
    map $http_user_agent $otel_trace_enabled {
        default          on;
        ~*uptimerobot    off;
        ~*blackbox       off;
    }
    otel_trace $otel_trace_enabled;

    # 들어온 traceparent가 있으면 이어받고, 없으면 새 trace를 시작해 백엔드로 넘긴다.
    # 계측이 없는 백엔드는 이 헤더를 무시한다.
    otel_trace_context propagate;

    # 기본 span 이름은 location 이름("/")이라 구분이 안 된다.
    otel_span_name "$request_method $host";

    # 정적 파일 전송 시 커널이 직접 처리(sendfile 시스템콜).
    # 파일을 유저 공간으로 복사하지 않아 빠르다.
    sendfile        on;

    # 응답 후 연결을 끊지 않고 유지할 시간(초).
    # 같은 클라이언트가 이어서 요청하면 TCP 핸드셰이크를 다시 안 해도 된다.
    keepalive_timeout  65;

    # 응답 본문을 gzip으로 압축해서 보낸다. 전송량 감소.
    gzip  on;

    # conf.d/ 폴더의 모든 .conf 파일을 여기에 그대로 끼워 넣는다.
    # 알파벳 순으로 읽히므로 00- 으로 시작하는 파일이 가장 먼저.
    # 실제 라우팅(server 블록)은 전부 그쪽에 있다.
    include /etc/nginx/conf.d/*.conf;
}
