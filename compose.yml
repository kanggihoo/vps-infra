services:
  nginx:
    image: nginx:alpine
    container_name: vps-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Quartz 정적 사이트. Jenkins가 빌드 결과물을 호스트 경로에 배치한다.
      - /opt/quartz-site:/var/www/notes:ro
      # Basic Auth 사용자 파일. VPS에서 htpasswd로 생성하며 Git에 넣지 않는다.
      - /opt/nginx-auth/notes.htpasswd:/etc/nginx/notes.htpasswd:ro
    networks:
      - proxy
    depends_on:
      - whoami
      - portal

  certbot:
    image: certbot/certbot
    container_name: vps-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot;
      sleep 12h & wait $${!}; done;'
    networks:
      - proxy

  whoami:
    image: traefik/whoami:v1.10
    container_name: vps-whoami
    restart: unless-stopped
    networks:
      - proxy

  portal:
    build: ./portal
    container_name: vps-portal
    restart: unless-stopped
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    container_name: vps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: vps-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proxy:
    name: vps_proxy
  data:
    name: vps_data

volumes:
  postgres-data:
    name: vps_postgres_data
  redis-data:
    name: vps_redis_data
  certbot-etc:
    name: vps_certbot_etc
  certbot-www:
    name: vps_certbot_www
