services:
  nginx:
    # 버전 고정: 움직이는 태그(alpine)는 Dockerfile이 안 바뀌어도
    # 빌드 시점에 따라 로컬과 VPS가 다른 이미지를 갖게 한다.
    # -otel 변형은 같은 nginx에 OpenTelemetry 모듈만 더한 공식 이미지다(ADR 0017).
    image: nginx:1.31.4-alpine-otel
    container_name: vps-nginx
    restart: unless-stopped
    # certbot은 nginx에 신호를 보낼 수 없으므로 nginx가 하루 한 번 스스로 reload해
    # 갱신된 인증서를 읽는다(ADR 0011). reload는 연결을 끊지 않는다.
    # 인자가 있으면(`compose run nginx nginx -t`) 루프 없이 그 명령만 실행한다.
    # compose에서 entrypoint를 바꾸면 이미지 기본 command도 비워진다.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ "$$#" -gt 0 ] && exec /docker-entrypoint.sh "$$@"
        while :; do sleep 86400 & wait $$!; nginx -s reload; done &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
      - nginx-with-daily-reload
    ports:
      - "80:80"
      - "443:443"
    environment:
      # nginx 공식 이미지 entrypoint가 기동 시 templates/*.template을
      # envsubst로 치환해 /etc/nginx/conf.d/에 쓴다. 새 의존성이 없다.
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      NGINX_LISTEN: ${NGINX_LISTEN:-80}
      # none = 빈 파일(로컬), live = 인증서 경로(VPS)
      TLS_MODE: ${TLS_MODE:-none}
      CHALLENGE_DOMAINS: ${CHALLENGE_DOMAINS:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Quartz 정적 사이트. named volume이므로 호스트 경로 의존이 없다.
      # 단계 7에서 Quartz를 이미지화하면 이 마운트 자체가 사라진다.
      - quartz-site:/var/www/notes:ro
      # Liam ERD 산출물. 각 프로젝트의 Jenkins job이 /<프로젝트>/ 폴더에 채운다.
      - erd-site:/var/www/erd:ro
      # Basic Auth 사용자 파일.
      #
      # 기본값이 공개 fixture(test/test)인 이유: 이 경로에 파일이 없으면
      # Docker가 디렉터리를 만들고 nginx가 auth_basic_user_file 오류로 죽는다.
      # 즉 clean clone에서 `up`이 실패해 로컬 검증을 시작할 수 없다.
      #
      # 실제 secret을 쓰려면 SOPS로 복호화한 뒤 이 변수를 덮어쓴다(단계 3):
      #   BASIC_AUTH_HTPASSWD=./secrets/basic-auth.htpasswd
      - ${BASIC_AUTH_HTPASSWD:-./nginx/test-fixtures/basic-auth.htpasswd}:/etc/nginx/basic-auth.htpasswd:ro
    networks:
      proxy:
        # 컨테이너는 VPS의 공개 IP로 자기 자신(nginx)에 붙지 못한다(hairpin, 2026-10-08 확인).
        # 공개 이름을 nginx의 내부 alias로 두면 같은 네트워크의 컨테이너가 실제 인증서와
        # SNI로 nginx를 거친다. Alloy의 서브도메인 probe가 이 경로를 쓴다(ADR 0016).
        aliases:
          - health.${BASE_DOMAIN:-localhost}
          - portal.${BASE_DOMAIN:-localhost}
          - jenkins.${BASE_DOMAIN:-localhost}
          - grafana.${BASE_DOMAIN:-localhost}
    depends_on:
      - whoami
      - portal

  certbot:
    # 태그를 생략하면 latest이므로 명시적으로 고정한다.
    image: certbot/certbot:v5.7.0
    container_name: vps-certbot
    restart: unless-stopped
    # 12시간마다 만료 30일 이내인지 확인하고, 그때만 실제로 갱신한다(ADR 0011).
    # 새 도메인 추가(--expand)와 최초 발급은
    # `docker compose run --rm --no-deps --entrypoint certbot certbot certonly ...`로 실행한다.
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - proxy

  whoami:
    image: traefik/whoami:v1.10
    container_name: vps-whoami
    restart: unless-stopped
    networks:
      - proxy

  portal:
    build: ./portal
    container_name: vps-portal
    restart: unless-stopped
    networks:
      - proxy

  # 스크립트 실행 진입점. 상주하지 않는다.
  #   docker compose run --rm tools ./scripts/test-select-target.sh
  # 호스트 셸이 PowerShell이든 zsh든 같은 명령으로 같은 결과가 나온다.
  tools:
    build: ./tools
    environment:
      # 복호화할 환경을 고른다(local|prod). compose run은 호스트 환경변수를
      # 자동으로 넘기지 않으므로 여기서 명시해야 ENV_NAME=prod가 전달된다.
      ENV_NAME: ${ENV_NAME:-local}
      # 컨테이너 안 root가 만든 파일을 호스트 사용자가 읽을 수 있게 한다.
      # 이 값이 없으면 복호화 결과가 root:root 600이 되어 compose가
      # .env를 읽지 못하고 "Permission denied"로 막힌다.
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    # docker.sock으로 호스트 Docker를 제어하므로, 레포를 호스트와 같은 경로에
    # 마운트해야 여기서 실행한 docker run의 -v 경로가 호스트에서도 유효하다.
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      # age 복호화 key. 호스트 홈 디렉터리에서 읽기 전용으로 가져온다(단계 3).
      - ${SOPS_AGE_KEY_DIR:-~/.config/sops/age}:/root/.config/sops/age:ro
    working_dir: /repo
    networks:
      - proxy
    # `up`이 이 컨테이너를 띄워 즉시 종료된 상태로 남기지 않도록 한다.
    # `docker compose run --rm tools ...`로만 실행한다.
    # (profile을 쓰지 않는 것은 spec 결정. scale 0이 같은 효과를 낸다)
    scale: 0

  postgres:
    image: postgres:16.14-alpine
    container_name: vps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4.9-alpine
    container_name: vps-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proxy:
    name: vps_proxy
  data:
    name: vps_data

volumes:
  postgres-data:
    name: vps_postgres_data
  redis-data:
    name: vps_redis_data
  certbot-etc:
    name: vps_certbot_etc
  certbot-www:
    name: vps_certbot_www
  # Quartz 빌드 산출물. 호스트 경로(/opt/quartz-site) 의존을 제거했다.
  quartz-site:
    name: vps_quartz_site
  # Liam ERD 산출물. 프로젝트 Jenkinsfile이 `-v vps_erd_site:/out`으로 채운다.
  erd-site:
    name: vps_erd_site
