services:
  nginx:
    # 버전 고정: 움직이는 태그(alpine)는 Dockerfile이 안 바뀌어도
    # 빌드 시점에 따라 로컬과 VPS가 다른 이미지를 갖게 한다.
    image: nginx:1.31.4-alpine
    container_name: vps-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # nginx 공식 이미지 entrypoint가 기동 시 templates/*.template을
      # envsubst로 치환해 /etc/nginx/conf.d/에 쓴다. 새 의존성이 없다.
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      NGINX_LISTEN: ${NGINX_LISTEN:-80}
      # none = 빈 파일(로컬), live = 인증서 경로(VPS)
      TLS_MODE: ${TLS_MODE:-none}
      CHALLENGE_DOMAINS: ${CHALLENGE_DOMAINS:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Quartz 정적 사이트. named volume이므로 호스트 경로 의존이 없다.
      # 단계 7에서 Quartz를 이미지화하면 이 마운트 자체가 사라진다.
      - quartz-site:/var/www/notes:ro
      # Basic Auth 사용자 파일.
      #
      # 기본값이 공개 fixture(test/test)인 이유: 이 경로에 파일이 없으면
      # Docker가 디렉터리를 만들고 nginx가 auth_basic_user_file 오류로 죽는다.
      # 즉 clean clone에서 `up`이 실패해 로컬 검증을 시작할 수 없다.
      #
      # 실제 secret을 쓰려면 SOPS로 복호화한 뒤 이 변수를 덮어쓴다(단계 3):
      #   NOTES_HTPASSWD=./secrets/notes.htpasswd
      - ${NOTES_HTPASSWD:-./nginx/test-fixtures/notes.htpasswd}:/etc/nginx/notes.htpasswd:ro
    networks:
      - proxy
    depends_on:
      - whoami
      - portal

  certbot:
    # 태그를 생략하면 latest이므로 명시적으로 고정한다.
    image: certbot/certbot:v5.7.0
    container_name: vps-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12시간마다 갱신을 시도하는 상주 루프.
    #
    # 최초 발급처럼 일회성 명령을 실행할 때는 entrypoint를 덮어써야 한다:
    #   docker compose run --rm --entrypoint certbot certbot certonly ...
    # (entrypoint를 그대로 두면 아래 루프가 실행되고 인자는 무시된다)
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot;
      sleep 12h & wait $${!}; done;'
    networks:
      - proxy

  whoami:
    image: traefik/whoami:v1.10
    container_name: vps-whoami
    restart: unless-stopped
    networks:
      - proxy

  portal:
    build: ./portal
    container_name: vps-portal
    restart: unless-stopped
    networks:
      - proxy

  # 스크립트 실행 진입점. 상주하지 않는다.
  #   docker compose run --rm tools ./scripts/test-select-target.sh
  # 호스트 셸이 PowerShell이든 zsh든 같은 명령으로 같은 결과가 나온다.
  tools:
    build: ./tools
    # docker.sock으로 호스트 Docker를 제어하므로, 레포를 호스트와 같은 경로에
    # 마운트해야 여기서 실행한 docker run의 -v 경로가 호스트에서도 유효하다.
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      # age 복호화 key. 호스트 홈 디렉터리에서 읽기 전용으로 가져온다(단계 3).
      - ${SOPS_AGE_KEY_DIR:-~/.config/sops/age}:/root/.config/sops/age:ro
    working_dir: /repo
    networks:
      - proxy
    # `up`이 이 컨테이너를 띄워 즉시 종료된 상태로 남기지 않도록 한다.
    # `docker compose run --rm tools ...`로만 실행한다.
    # (profile을 쓰지 않는 것은 spec 결정. scale 0이 같은 효과를 낸다)
    scale: 0

  postgres:
    image: postgres:16.14-alpine
    container_name: vps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4.9-alpine
    container_name: vps-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  proxy:
    name: vps_proxy
  data:
    name: vps_data

volumes:
  postgres-data:
    name: vps_postgres_data
  redis-data:
    name: vps_redis_data
  certbot-etc:
    name: vps_certbot_etc
  certbot-www:
    name: vps_certbot_www
  # Quartz 빌드 산출물. 호스트 경로(/opt/quartz-site) 의존을 제거했다.
  quartz-site:
    name: vps_quartz_site
