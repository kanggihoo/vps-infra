services:
  jenkins:
    build: .
    container_name: vps-jenkins
    restart: unless-stopped
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vps-infra:/opt/vps-infra
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: vps_proxy

volumes:
  jenkins-data:
    name: vps_jenkins_data
