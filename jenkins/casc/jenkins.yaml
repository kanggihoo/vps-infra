# Jenkins Configuration as Code.
#
# ⚠️ GUI에서 변경한 설정은 다음 reload나 재기동 때 사라진다.
#    JCasC가 관리하는 항목을 그때마다 덮어쓰기 때문이다(ADR 0009).
#    설정 변경은 항상 이 파일 수정 -> 커밋 -> push로 한다.
#    vps-infra 파이프라인이 매 배포 끝에 reload하므로 재빌드는 필요 없다.
#    GUI는 조회와 빌드 실행에만 쓴다.

jenkins:
  systemMessage: "이 Jenkins는 jenkins/casc/jenkins.yaml로 관리된다. GUI 변경은 다음 배포(reload) 때 사라진다."

  # 서로 다른 Job도 한 번에 하나만 실행한다. Job별 disableConcurrentBuilds만으로는
  # Quartz와 infra build가 겹칠 수 있어, VPS 빌드 피크를 측정하기 전에는 전역 1로 둔다.
  # 이 제한은 Docker daemon의 BuildKit 메모리 상한은 아니므로 별도 관측이 필요하다.
  numExecutors: 1

  # anonymous read 차단 + signup 차단.
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
  securityRealm:
    local:
      # signup 차단
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  # remotingSecurity는 이 Jenkins 버전에서 no-op이므로 두지 않는다.
  # (설정하면 "no longer has any effect" 경고와 스택트레이스가 남는다)

security:
  # 스크립트 승인 없이 job-dsl이 동작하도록 한다.
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

unclassified:
  location:
    url: "${JENKINS_URL}"

  # 파이프라인 트레이스·Jenkins 메트릭·빌드 로그를 Alloy로 보낸다(ADR 0016).
  # Alloy는 별도 compose 프로젝트라 없을 수 있다. 그때는 export만 실패하고 빌드는 계속된다.
  openTelemetry:
    endpoint: "http://alloy:4317"
    authentication: "noAuthentication"
    serviceName: "jenkins"
    serviceNamespace: "ci"
    exportOtelConfigurationAsEnvironmentVariables: false
    # 빌드 소요 시간 히스토그램(ci_pipeline_run_duration)을 job별로 나눈다. 기본값은 아무 job도
    # 허용하지 않아 모두 ci_pipeline_id="#other#"로 묶인다. job이 몇 개뿐이라 전부 허용한다.
    configurationProperties: "otel.instrumentation.jenkins.run.metric.duration.allow_list=.*"
    observabilityBackends:
      - grafana:
          # 빌드 화면의 "View pipeline with Grafana" 링크가 이 주소의 Tempo로 간다.
          # 링크 전용이라 환경마다 나누지 않는다. 로컬 Jenkins의 링크도 운영 Grafana를 가리킨다.
          grafanaBaseUrl: "https://grafana.kkh-hub.tech"
          grafanaOrgId: "1"
          # Tempo 데이터소스 UID. observability/grafana/provisioning/datasources와 같아야 한다.
          tempoDataSourceIdentifier: "tempo"
          tempoQueryType: "traceql"
          # 빌드 로그를 Loki로 보내되 Jenkins 디스크에도 남긴다. Jenkins 화면은 디스크에서 읽으므로
          # Loki가 죽어도 빌드 로그를 잃지 않는다(Jenkins가 관측 스택에 의존하지 않는다).
          grafanaLogsBackend:
            grafanaLogsBackendBackendWithLogMirroringInJenkins:
              lokiOTelLogFormat: "LOKI_V3_OTEL_FORMAT"

  # 모든 job이 @Library 없이 쓰는 공용 라이브러리(ADR 0012).
  # vps-infra 레포의 jenkins/shared-lib/를 main 기준으로 읽는다.
  globalLibraries:
    libraries:
      - name: "vps-shared"
        defaultVersion: "main"
        implicit: true
        allowVersionOverride: false
        # true면 라이브러리 커밋이 vps-info 같은 다른 job의 변경 목록에 섞이고,
        # vps-infra push가 그 job들의 빌드까지 일으킨다.
        includeInChangesets: false
        retriever:
          modernSCM:
            libraryPath: "jenkins/shared-lib/"
            scm:
              git:
                remote: "${INFRA_SCM_URL}"
                credentialsId: "${SCM_CREDENTIAL_ID}"

credentials:
  system:
    domainCredentials:
      - credentials:
          # GitHub checkout용 PAT.
          # Jenkins volume이 유실되어도 이 credential까지 복원되어야
          # Job만 복원되고 checkout이 실패하는 반쪽 복구를 피한다(ADR 0010).
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "${GITHUB_PAT_USER}"
              password: "${GITHUB_PAT_TOKEN}"
              description: "GitHub PAT for SCM checkout"
          # SOPS 복호화용 age key. Jenkins가 파일로 받아 쓰므로
          # 호스트에 key를 노출하지 않는다(ADR 0010).
          #
          # secretBytes는 base64 문자열을 기대한다. age key는 3줄이고
          # compose의 .env는 여러 줄 값을 담을 수 없으므로, 주입 전에
          # base64로 한 줄로 만들어 넘긴다:
          #   SOPS_AGE_KEY_CONTENT=$(base64 < ~/.config/sops/age/keys.txt | tr -d '\n')
          # 여기서 ${base64:...}를 다시 씌우면 이중 인코딩이 된다.
          - file:
              scope: GLOBAL
              id: "sops-age-key"
              fileName: "keys.txt"
              secretBytes: "${SOPS_AGE_KEY_CONTENT}"
              description: "age key for SOPS decryption (base64)"
          # 빌드 알림용 Mattermost incoming webhook URL(ADR 0012).
          # 비어 있으면 notifyMattermost()가 알림을 건너뛴다(로컬 Jenkins).
          - string:
              scope: GLOBAL
              id: "mattermost-webhook"
              secret: "${MATTERMOST_WEBHOOK_URL:-}"
              description: "Mattermost incoming webhook for build notifications"

jobs:
  # job-dsl seed. 아래 스크립트가 Job을 만든다.
  - file: /usr/share/jenkins/casc/jobs.groovy
