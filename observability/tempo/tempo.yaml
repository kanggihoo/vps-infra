# Tempo 3.x 단일 바이너리(-target=all 기본값), 로컬 디스크 저장(ADR 0016).
# 3.0에서 ingester와 compactor 블록이 없어졌다. 2.x 예제를 그대로 쓰면 기동에 실패한다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # 기본값은 localhost:4317이라 다른 컨테이너(Alloy)가 붙지 못한다.
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# 보존 72시간. 3.x에서 compactor.compaction에서 이 위치로 옮겨졌다.
backend_worker:
  compaction:
    block_retention: 72h

# GOMEMLIMIT를 컨테이너 mem_limit의 0.8로 맞춘다.
memory:
  automemlimit_enabled: true

usage_report:
  reporting_enabled: false
